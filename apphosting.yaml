# Rama live: main (configurada en Firebase Console → App Hosting → Backend → Settings)

runConfig:
  concurrency: 10

env:
  # Firebase Web SDK: Next.js necesita estas variables en BUILD para inyectarlas
  # en el bundle cliente. Si faltan, Auth falla con auth/invalid-api-key.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NOTIFICAS_FIREBASE_PROJECT_ID
    secret: NOTIFICAS_FIREBASE_PROJECT_ID
    availability:
      - RUNTIME

  - variable: NOTIFICAS_FIREBASE_CLIENT_EMAIL
    secret: NOTIFICAS_FIREBASE_CLIENT_EMAIL
    availability:
      - RUNTIME

  - variable: NOTIFICAS_FIREBASE_PRIVATE_KEY
    secret: NOTIFICAS_FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME

  - variable: NOTIFICASHUB_PROJECT_ID
    value: studio-3864746689-59018
    availability:
      - RUNTIME

  - variable: WHATSAPP_VERIFY_TOKEN
    value: notificas_webhook_2026
    availability:
      - BUILD
      - RUNTIME
  # WhatsApp Cloud API: requerido para enviar mensajes (ask_choice, respuestas)
  - variable: WHATSAPP_PHONE_NUMBER_ID
    value: "693302653873170"
    availability:
      - RUNTIME
  # Token de Meta: crear con firebase apphosting:secrets:set whatsapp-access-token
  # y grant: firebase apphosting:secrets:grantaccess WHATSAPP_ACCESS_TOKEN --backend <nombre>
  - variable: WHATSAPP_ACCESS_TOKEN
    secret: whatsapp-access-token
    availability:
      - RUNTIME
  # HeartLink - reenvío de mensajes entrantes
  - variable: HEARTLINK_URL
    value: https://heartlink--heartlink-f4ftq.us-central1.hosted.app
    availability:
      - BUILD
      - RUNTIME
  - variable: INTERNAL_SECRET
    value: heartlink_internal_2026
    availability:
      - RUNTIME
  # Sin user_memberships → enrutar a Planes de ahorro (primer contacto)
  - variable: DEFAULT_INBOUND_TENANT_ID
    value: planesdeahorro
    availability:
      - RUNTIME
  - variable: NOTIFICASHUB_URL
    secret: NOTIFICASHUB_URL

  - variable: GOOGLE_AI_API_KEY
    secret: GOOGLE_AI_API_KEY
    availability:
      - RUNTIME

  - variable: NOTIFICAS_BILLING_SHARED_SECRET
    secret: NOTIFICAS_BILLING_SHARED_SECRET
    availability:
      - RUNTIME

  - variable: AFIP_CUIT
    secret: AFIP_CUIT
    availability:
      - RUNTIME

  - variable: AFIP_PRODUCTION
    secret: AFIP_PRODUCTION
    availability:
      - RUNTIME

  - variable: AFIP_PTO_VTA
    secret: AFIP_PTO_VTA
    availability:
      - RUNTIME

  - variable: AFIP_CERT_PEM
    secret: AFIP_CERT_PEM
    availability:
      - RUNTIME

  - variable: AFIP_KEY_PEM
    secret: AFIP_KEY_PEM
    availability:
      - RUNTIME

  - variable: AFIP_CHAIN_PEM
    secret: AFIP_CHAIN_PEM
    availability:
      - RUNTIME

  - variable: AFIP_CERT_PATH
    secret: AFIP_CERT_PATH
    availability:
      - RUNTIME

  - variable: AFIP_KEY_PATH
    secret: AFIP_KEY_PATH
    availability:
      - RUNTIME
